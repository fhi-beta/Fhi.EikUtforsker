@if (folderEntry!.isFile) {
  <mat-list-item (click)="$event.stopPropagation()">
    <mat-icon mat-list-icon>description</mat-icon>
    <a href="/api/eik/file?uri={{resource()!.uri}}" matTooltip="{{dateString(resource()!)}} - {{resource()!.contentLength}} bytes" matTooltipPosition="after" download="{{resource()!.name}}">{{decodeURI(resource()!.name)}}</a>
    <button mat-button (click)="dekrypter(resource()!.uri)">Dekrypter</button>
  </mat-list-item>
}

@if (!folderEntry!.isFile) {
  <mat-expansion-panel (click)="handleFolderClick($event, folderEntry!)" [togglePosition]="'before'">
    <mat-expansion-panel-header>
      <mat-panel-title>
        <text matTooltip="{{dateString(resource()!)}}" matTooltipPosition="after">
          {{ decodeURI(resource()!.name) }}
        </text>
      </mat-panel-title>
    </mat-expansion-panel-header>
    <ng-template matExpansionPanelContent>
      @if (!folderEntry!.hasInsertedChildren) {
        <div>laster...</div>
      }
      @if (folderEntry!.isOpen) {
        <mat-list>
          @for (child of folderEntry!.children; track child) {
            <app-historikk-entry [resource]="child.resource" />
          }
        </mat-list>
      }
    </ng-template>
  </mat-expansion-panel>
}
